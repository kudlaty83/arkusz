name: arkusz
services:
  setup:
    image: localhost/arkusz-app:1.1.0
    build:
      context: .
      dockerfile: Containerfile
    entrypoint:
    - php
    - /var/www/prepare-storage.php
    restart: 'no'
    volumes:
    - type: bind
      source: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}/config
      target: /run/arkusz-secrets
      bind:
        create_host_path: true
        selinux: z
    - type: bind
      source: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}/app
      target: /opt/arkusz-app
      bind:
        create_host_path: true
        selinux: z
    - type: bind
      source: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}/sessions
      target: /opt/arkusz-sessions
      bind:
        create_host_path: true
        selinux: z
    environment:
      APP_DATA_HOST_PATH: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}
  db:
    image: docker.io/library/mariadb:13
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      MARIADB_DATABASE: drukarnia
      MARIADB_USER: drukarnia
      MARIADB_PASSWORD_FILE: /run/arkusz-secrets/db-password
      MARIADB_ROOT_PASSWORD_FILE: /run/arkusz-secrets/db-root-password
    volumes:
    - type: bind
      source: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}/database
      target: /var/lib/mysql
      bind:
        create_host_path: true
        selinux: Z
    - type: bind
      source: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}/config
      target: /run/arkusz-secrets
      read_only: true
      bind:
        create_host_path: true
        selinux: z
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  web:
    image: localhost/arkusz-app:1.1.0
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: drukarnia
      DB_PASSWORD_FILE: /run/arkusz-secrets/db-password
      ADMIN_PASSWORD_FILE: /run/arkusz-secrets/admin-password
      SEED_DEMO: ${SEED_DEMO:-0}
    ports:
    - 127.0.0.1:${APP_PORT:-8080}:80
    volumes:
    - type: bind
      source: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}/config
      target: /run/arkusz-secrets
      read_only: true
      bind:
        create_host_path: true
        selinux: z
    - type: bind
      source: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}/app
      target: /var/www
      read_only: true
      bind:
        create_host_path: true
        selinux: z
    - type: bind
      source: ${APP_DATA_DIR:-${PWD:?Ustaw APP_DATA_DIR na bezwzgledna sciezke}/app_data}/sessions
      target: /var/lib/php/sessions
      bind:
        create_host_path: true
        selinux: z
    healthcheck:
      test:
      - CMD
      - php
      - -r
      - 'exit(@file_get_contents(''http://127.0.0.1/health.php'') === ''{"status":"ok"}'' ? 0 : 1);'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
